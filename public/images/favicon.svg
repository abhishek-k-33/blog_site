<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 108" fill="none">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="favShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-1" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Speech bubble page body in crisp clean ivory/lilac tone -->
  <path d="
    M 20 8
    L 65 8
    L 65 24
    Q 65 32, 73 32
    L 88 32
    L 88 72
    Q 88 84, 76 84
    L 36 84
    L 16 100
    L 20 84
    Q 8 84, 8 72
    L 8 20
    Q 8 8, 20 8
    Z
  " fill="#e0dced" />

  <!-- Corner Dog-Ear Fold in celestial ribbon blue -->
  <path d="
    M 65 8
    L 88 32
    L 73 32
    Q 65 32, 65 24
    Z
  " fill="url(#favGrad)" filter="url(#favShadow)" />

  <!-- Micro article lines in ribbon blue -->
  <rect x="22" y="42" width="30" height="5" rx="2.5" fill="#818CF8" opacity="0.85" />
  <rect x="22" y="52" width="46" height="5" rx="2.5" fill="#6366F1" opacity="0.65" />
</svg>
